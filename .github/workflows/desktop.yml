# The Creavia desktop app: checked on every pull request (typecheck, Rust build, the headless self-check), built for
# macOS (Apple Silicon and Intel), Windows and Linux on main, and released on a version tag (v*): a draft release is
# made, every installer is uploaded to it, and only when all four built is it published, so "latest" is never half done.
# Or from the Actions tab: Desktop → Run workflow → "release" = v0.2.0 makes the tag and the release from main.
# Auto-update: with the TAURI_SIGNING_PRIVATE_KEY secret set, each build also makes signed update bundles and the
# release gets latest.json, which installed apps read (src-tauri/src/updater.rs; the public key is in tauri.conf.json).
# Without it the installers still build; they just carry no update. APPLE_* secrets (optional) notarise macOS.
name: Desktop
on:
  pull_request:
    paths: ["desktop/**", "cloud/components/**", "cloud/app/globals.css", "engine/**", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release this version (like v0.2.0): makes the tag and the release from this commit. Empty: just build."
        required: false
        default: ""

concurrency: { group: "desktop-${{ github.ref }}", cancel-in-progress: true }

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }
      - name: Linux libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck -w desktop
      - run: npm run build -w desktop
      - name: Rust build and self-check (settings, catalogue, the local MCP)
        working-directory: desktop/src-tauri
        run: |
          cargo build
          CREAVIA_HOME=$RUNNER_TEMP/creavia ./target/debug/creavia --self-check

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: check
    runs-on: ubuntu-22.04
    permissions: { contents: write }
    outputs: { id: "${{ steps.make.outputs.result }}" }
    steps:
      - id: make
        uses: actions/github-script@v7
        env: { TAG: "${{ inputs.release }}" }
        with:
          script: |
            const tag = process.env.TAG || context.ref.replace('refs/tags/', '');
            if (!/^v\d+\.\d+\.\d+/.test(tag)) throw new Error(`"${tag}" isn't a version like v0.2.0`);
            const found = await github.rest.repos.getReleaseByTag({ ...context.repo, tag }).catch(() => null);
            if (found) return found.data.id;
            const { data } = await github.rest.repos.createRelease({ ...context.repo, tag_name: tag, target_commitish: context.sha, name: `Creavia ${tag}`, draft: true,
              body: [
                'Download the file for your computer:',
                '- **Mac with an Apple chip** (M1 to M4): `Creavia_*_aarch64.dmg`',
                '- **Mac with Intel**: `Creavia_*_x64.dmg`',
                '- **Windows**: `Creavia_*_x64-setup.exe`',
                '- **Linux**: `Creavia_*_amd64.AppImage` or `.deb`',
                '',
                'First time on a Mac: right-click Creavia, choose Open, then Open. On Windows: More info, then Run anyway. The in-app guide shows every step.',
                'Already have Creavia? It updates itself: no need to download this.',
              ].join('\n') });
            return data.id;

  build:
    # on main there's no release job: build anyway (it's skipped, not failed)
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.check.result == 'success' && needs.release.result != 'failure' }}
    needs: [check, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, args: "--target aarch64-apple-darwin" }
          - { os: macos-latest, args: "--target x86_64-apple-darwin" }
          - { os: windows-latest, args: "" }
          - { os: ubuntu-22.04, args: "" }
    runs-on: ${{ matrix.os }}
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }
      - if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm install --no-audit --no-fund
      - name: Update bundles only when the signing key is there
        id: upd
        shell: bash
        env: { KEY: "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" }
        run: if [ -n "$KEY" ]; then echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"; fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }} ${{ steps.upd.outputs.args }}
          releaseId: ${{ needs.release.outputs.id }}
          includeUpdaterJson: ${{ steps.upd.outputs.args != '' }}
          updaterJsonPreferNsis: true
      - if: needs.release.outputs.id == ''
        uses: actions/upload-artifact@v4
        with:
          name: creavia-${{ matrix.os }}-${{ strategy.job-index }}
          path: |
            desktop/src-tauri/target/**/release/bundle/**/*.dmg
            desktop/src-tauri/target/**/release/bundle/**/*.msi
            desktop/src-tauri/target/**/release/bundle/**/*.exe
            desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            desktop/src-tauri/target/**/release/bundle/**/*.deb
          if-no-files-found: ignore

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [release, build]
    runs-on: ubuntu-22.04
    permissions: { contents: write }
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({ ...context.repo, release_id: Number('${{ needs.release.outputs.id }}'), draft: false, make_latest: 'true' });
