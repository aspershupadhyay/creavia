# Debugging aid, run by hand: builds the app on Windows, opens it with WebView2's debugging port
# (CREAVIA_WEBVIEW_DEBUG_PORT, src-tauri/src/window.rs), records what the page does, then crashes the page on purpose
# and checks that Creavia reopens itself in safe graphics (scripts/winprobe.mjs).
name: Windows probe
on:
  workflow_dispatch:
  push:
    branches: [claude/focused-brahmagupta-khr8vt]
    paths: [".github/workflows/winprobe.yml", "scripts/winprobe.mjs", "desktop/src-tauri/src/window.rs", "desktop/src/bridge/**"]
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }
      - run: npm install --no-audit --no-fund
      - name: Build the app
        working-directory: desktop
        run: npx tauri build --no-bundle
      - name: Open it, watch it, crash it
        shell: pwsh
        run: |
          npm i --no-save playwright-core@1.49.1 | Out-Null
          $env:CREAVIA_WEBVIEW_DEBUG_PORT = "9222"
          $env:CREAVIA_HOME = "$env:RUNNER_TEMP\creavia"
          New-Item -ItemType Directory -Force probe | Out-Null
          Start-Process -FilePath "desktop\src-tauri\target\release\creavia.exe"
          node scripts/winprobe.mjs probe
          $code = $LASTEXITCODE
          Get-Process | Where-Object { $_.Name -match "creavia|msedgewebview2" } | Format-Table Name, Id, @{n="MB";e={[int]($_.WorkingSet64/1MB)}} | Out-String | Write-Host
          Write-Host "safe-graphics flag: $(Get-Content "$env:RUNNER_TEMP\creavia\safe-graphics" -ErrorAction SilentlyContinue)"
          exit $code
