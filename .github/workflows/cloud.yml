# Creavia Cloud: checked on every pull request (schema in step with db/, typecheck, the Workers build). On main it
# deploys to Cloudflare when the repository has CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (your own
# studio); without them it only builds. Forks deployed with the Deploy to Cloudflare button deploy through Cloudflare.
name: Cloud
on:
  pull_request:
    paths: ["cloud/**", ".github/workflows/cloud.yml"]
  push:
    branches: [main]
    paths: ["cloud/**", ".github/workflows/cloud.yml"]
  workflow_dispatch:

concurrency: { group: "cloud-${{ github.ref }}", cancel-in-progress: false }

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Sentry (docs/adr/0003-sentry.md): the browser's DSN, built in; unset means no Sentry in the browser. The
      # Worker's own SENTRY_DSN and ENGINE_SENTRY_DSN are set on the Worker (wrangler secret put), not here.
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN_CLOUD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: lib/schema.ts matches db/*.sql
        working-directory: cloud
        run: node scripts/gen-schema.mjs && git diff --exit-code lib/schema.ts
      - run: npm run typecheck -w cloud
      - name: Every MCP tool registers
        working-directory: cloud
        run: npx -y tsx scripts/check-register.mts
      - name: Workers build (OpenNext)
        run: npm run build:worker -w cloud
      - name: Deploy
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: cloud
        run: npx opennextjs-cloudflare deploy
