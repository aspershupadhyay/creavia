# Checks on every pull request and every push to main, whatever it touches, so branch protection can require them:
# lint and format (Biome, ruff, rustfmt, clippy), unit tests in every part (Vitest in cloud and desktop, cargo test,
# pytest in the engine), and the cloud's signed-out sweep of every route (cloud/test/routes.test.ts), the first part of
# the workspace-isolation suite. The builds and the self-check stay in cloud.yml and desktop.yml.
# docs/adr/0001-quality-tooling.md says why each tool, and how files written before them are handled.
name: Checks
on:
  pull_request:
  push:
    branches: [main]

concurrency: { group: "checks-${{ github.ref }}", cancel-in-progress: true }

jobs:
  typescript:
    name: TypeScript (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Lint and format (Biome)
        run: npx biome ci .
      - name: Types
        run: npm run check
      - name: Desktop unit tests
        run: npm test -w desktop
      - name: Cloud unit tests and the signed-out sweep of every route
        run: npm test -w cloud

  engine:
    name: Engine (lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tools (pinned)
        run: pip install ruff==0.16.9 pytest==8.4.2
      # from inside engine/, so ruff.toml's file lists are read relative to it (with --config they'd follow the cwd)
      - name: Lint (ruff)
        working-directory: engine
        run: ruff check .
      - name: Format (ruff)
        working-directory: engine
        run: ruff format --check .
      - name: Every file compiles
        run: python -m py_compile engine/*.py engine/engines/*.py
      - name: Unit tests (pytest)
        run: python -m pytest engine

  rust:
    name: Rust (format, clippy, tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }
      - name: Linux libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Format (rustfmt)
        working-directory: desktop/src-tauri
        run: cargo fmt --check
      - name: Lint (clippy, warnings are errors)
        working-directory: desktop/src-tauri
        run: cargo clippy --lib --bins --tests -- -D warnings
      - name: Unit tests
        working-directory: desktop/src-tauri
        run: cargo test --lib
