[package]
name = "creavia"
version = "0.1.0"
description = "Creavia: create, publish and grow, on your computer or your own cloud."
edition = "2021"
rust-version = "1.80"

[lib]
name = "creavia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream", "gzip", "brotli", "http2", "charset", "system-proxy"] }
futures-util = "0.3"
axum = "0.8"
url = "2"
dirs = "6"
sysinfo = { version = "0.35", default-features = false, features = ["system", "disk"] }
rand = "0.9"
percent-encoding = "2"
once_cell = "1"
parking_lot = "0.12"
log = "0.4"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
